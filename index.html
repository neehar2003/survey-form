<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>
<h1 id="title">Survey Form</h1>
<p id="description">Thank you for taking the time </p>
<form id="survey-form">
  <input id="name" type="text" required placeholder="name" value="Enter Your Name">
  
  <input id="email" type="email" required placeholder="email" value="Enter Your Email">

   <input id="number" type="number" required min="2" max="100" placeholder="Age" value="Age">
   
   <label id="name-label">Years old.</label>
     <label id="email-label">Current</label>
       <label id="number-label">Role</label>
       <select id="dropdown">
        <option>Student</option>
        <option>Graduate</option>

        <input type="radio" name="radio1" value="Yes">Grade S
         <input type="radio" name="radio1" value="No">Grade A
        Critical Thinker?<input type="checkbox" value="yes">Good Communication?
         <input type="checkbox" value="no">
         <textarea>Leave a comment</textarea>
         <input id="submit" type="submit">
       </select>
  <body></body>
</html>
